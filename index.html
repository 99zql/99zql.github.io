<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://api.iconify.design" crossorigin>

<body>

<svg id="defs" width="0" height="0" style="position:absolute" aria-hidden="true"></svg>

<div class="island" id="island">
  <div class="mini art" id="miniArt"></div>
  <div class="mini eq"><i></i><i></i><i></i><i></i></div>
  <div class="full">
    <div class="row1">
      <div class="art" id="art"></div>
      <div class="meta"><b id="ttl"></b><span id="sub"></span></div>
      <div class="eq"><i></i><i></i><i></i><i></i></div>
    </div>
    <div class="prog" id="prog">
      <div class="bar"><div class="fill" id="fill"></div></div>
      <div class="times"><span id="cur">0:00</span><span id="dur">0:00</span></div>
    </div>
    <div class="ctrls">
      <button id="prev" aria-label="Anterior"><span data-i="rewind-fill"></span></button>
      <button id="play" class="pp" aria-label="Reproduzir"><span class="i-play" data-i="play-fill"></span><span class="i-pause" data-i="pause-fill"></span></button>
      <button id="next" aria-label="Próxima"><span data-i="fast-forward-fill"></span></button>
    </div>
  </div>
</div>

<div class="clockw rise d1"><div class="clockin" id="clockin">
  <section class="clock depth" data-depth="8">
    <div class="date" id="date"></div>
    <div id="timebox" role="img"></div>
  </section>
</div></div>

<section class="glassbox depth win" id="win" data-depth="5" data-radius="32" data-bezel="46" data-power="2.5" aria-hidden="true">
  <div class="in">
    <div class="wbar" id="wbar">
      <div class="dots"><button class="dt r" data-s="×" id="wClose" aria-label="Fechar"></button><button class="dt y" data-s="−" id="wMin" aria-label="Minimizar"></button><button class="dt g" data-s="+" id="wMax" aria-label="Expandir"></button></div>
      <div class="wtt" id="wTitle"></div>
    </div>
    <div class="pg" id="pg"></div>
  </div>
</section>

<div class="stack">
  <nav class="glassbox depth nav rise d3" data-depth="10" data-radius="26" data-bezel="24" data-power="3" data-tint="rgba(255,255,255,.04)">
    <div class="in"><div class="items" id="navItems"><span class="lens" id="lens"><span class="lens-clip"><span class="lens-items" id="lensItems" aria-hidden="true"></span></span></span></div></div>
  </nav>
  <section class="glassbox depth profile rise d4" data-depth="12" data-radius="40" data-bezel="32" data-power="3">
    <div class="in">
      <div class="avatar" id="avatar"></div>
      <div class="pinfo">
        <div class="pname" id="pname"></div>
        <div class="links" id="links"></div>
      </div>
    </div>
  </section>
</div>

<div class="lb" id="lb" aria-hidden="true">
  <div class="lb-bg"></div>
  <div class="lb-stage" id="lbStage"><div class="lb-img photo" id="lbImg"></div></div>
  <div class="lb-top">
    <div class="lb-pill">
      <button id="lbOut" aria-label="Diminuir zoom"><span data-i="dash-lg"></span></button>
      <span class="zv" id="lbZv">100%</span>
      <button id="lbIn" aria-label="Aumentar zoom"><span data-i="plus-lg"></span></button>
    </div>
    <button class="lb-x" id="lbX" aria-label="Fechar"><span data-i="x-lg"></span></button>
  </div>
  <button class="lb-nav p" id="lbP" aria-label="Anterior"><span data-i="chevron-left"></span></button>
  <button class="lb-nav n" id="lbN" aria-label="Próxima"><span data-i="chevron-right"></span></button>
  <div class="lb-cap" id="lbCap"><b id="lbT"></b><span id="lbD"></span><i id="lbC"></i></div>
</div>

<div class="toast" id="toast"></div>
